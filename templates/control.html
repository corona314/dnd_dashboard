<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control DnD</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #1e1e1e;
    color: white;
    text-align: center;
}
.personajes {
    display: flex;
    flex-wrap: nowrap;
    gap: 20px;
    justify-content: center;
}
.personaje {
    border: 1px solid #ccc;
    padding: 10px;
    width: 200px;
    text-align: center;
    background-color: #2e2e2e;
    border-radius: 8px;
    color: white;
    transition: transform 0.3s, box-shadow 0.3s;
}
.barra {
    background-color: #555;
    width: 100%;
    height: 20px;
    border-radius: 5px;
    margin: 5px 0;
}
.barra-vida {
    height: 100%;
    width: 0%;
    border-radius: 5px;
    background-color: green;
}
input, select, button {
    margin: 2px;
    font-size: 0.9em;
}
label {
    display: inline-block;
    margin: 5px 0;
    font-weight: bold;
    color: #d4c6a8;
    text-shadow: 1px 1px 2px #000;
}
.stat-label {
    display: inline-block;
    margin: 4px 0;
    font-weight: bold;
    color: #ddd;
}
select {
    background-color: #2e2e2e;
    color: white;
    border: 1px solid #555;
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 0.9em;
    transition: border-color 0.3s, box-shadow 0.3s;
}

select:focus {
    outline: none;
    border-color: #9b6b34;
    box-shadow: 0 0 6px #9b6b34;
}
input[type="number"], 
input[type="text"] {
    background-color: #2e2e2e;
    color: white;
    border: 1px solid #555;
    border-radius: 5px;
    padding: 4px 6px;
    width: 60px;
    text-align: center;
    font-size: 0.9em;
    transition: border-color 0.3s, box-shadow 0.3s;
}
input:focus {
    outline: none;
    border-color: #356de5;
    box-shadow: 0 0 6px #356de5;
}
.button {
    background-color: #9b6b34; 
    border: none;
    color: white;
    padding: 6px 12px;
    margin: 2px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.9em;
    transition: background-color 0.3s, transform 0.2s;
}
.button:hover {
    background-color: #643e13;
    transform: scale(1.05);
}
.button:active {
    background-color: #ac8b66;
    transform: scale(0.95);
}
.button-red {
    background-color: #864a49;
}
.button-red:hover {
    background-color: #522c2b;
}

.button-blue {
    background-color: #5d72a0;
}
.button-blue:hover {
    background-color: #35425e;
}

</style>
</head>
<body>
<h1>Control DnD</h1>
<div id="ronda-titulo">Ronda: 0</div>

<!-- Controles para Estados normales -->
<div>
    <label>Personaje:</label>
    <select id="personaje-estado"></select>
</div>
<div>
    <label>Estado:</label>
    <select id="estado-seleccionado">
        <option>Agarrado</option><option>Apresado</option><option>Asustado</option><option>Aturdido</option>
        <option>Cansancio</option><option>Cegado</option><option>Derribado</option><option>Ensordecido</option>
        <option>Envenenado</option><option>Hechizado</option><option>Incapacitado</option><option>Inconsciente</option>
        <option>Invisible</option><option>Paralizado</option><option>Petrificado</option>
    </select>
</div>
<div>
    <button class="button" onclick="agregarEstadoNormal()">Agregar estado</button>
    <button class="button" onclick="quitarEstadoNormal()">Quitar estado</button>
</div>

<!-- Añadir Personajes -->
<div>   
    <label for="nombrePersonaje">Nombre Personaje</label>
    <input type="text" id="nombrePersonaje" placeholder="Goblin" />
</div>
<div>   
    <button class="button" onclick="agregarPersonaje()">Agregar Personaje</button>
    <button class="button" onclick="eliminarPersonaje()">Eliminar Personaje</button>

</div>
<!-- Controles para Enfermedades -->
<div>
    <label>Personaje:</label>
    <select id="personaje-enfermedad"></select>
</div>
<div>
    <label>Enfermedad:</label>
    <select id="enfermedad-seleccionada"></select>
</div>
<div>
  <button class="button" onclick="agregarEnfermedad()">Agregar enfermedad</button>
  <button class="button" onclick="quitarEnfermedad()">Quitar enfermedad</button>
</div>
<div id="personajes-control"></div>
<button class="button" onclick="pasarTurno()">Pasar turno</button>

<script>
let personajes = [];
let ronda = 0;
let turnoActual = 0;
let initialized = false;

// Progresión de enfermedades
const enfermedadProgresion = {
    "Fiebre de los Pantanos": ["Leve", "Moderada", "Grave", "Crítica"],
    "Pulmonía Trémula": ["Leve", "Moderada", "Grave", "Crítica"],
    "Agua Negra": ["Leve", "Moderada", "Grave", "Crítica"],
    "Infección de Herida": ["Leve", "Moderada", "Grave", "Crítica"],
    "Gripe del Aarakocra": ["Leve", "Moderada", "Grave", "Crítica"],
    "Migraña": ["Leve", "Moderada", "Grave", "Crítica"],
    "Parásitos Intestinales": ["Leve", "Moderada", "Grave", "Crítica"],
    "Somnolencia Letárgica": ["Leve", "Moderada", "Grave", "Crítica"],
    "Peste de Mantícora": ["Leve", "Moderada", "Grave", "Crítica"],
    "Toxina Neblinosa": ["Leve", "Moderada", "Grave", "Crítica"],
    "Verruga Astral": ["Leve", "Moderada", "Grave", "Crítica"],
    "Sombra Consumidora": ["Leve", "Moderada", "Grave", "Crítica"]
};


function colorBarra(vida_actual, vida_max) {
    const pct = Math.max(0, Math.min(1, vida_actual/vida_max));
    const r = Math.round(255*(1-pct));
    const g = Math.round(255*pct);
    return `rgb(${r},${g},0)`;
}

async function fetchData() {
    const res = await fetch('/dashboard-data');
    const data = await res.json();
    personajes = data.personajes;

    if (!initialized) {
        ronda = 0;
        document.getElementById('ronda-titulo').textContent = `Ronda: ${ronda}`;
        await fetch('/actualizar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ronda: 0 })
        });
        initialized = true;
    } else {
        ronda = data.ronda ?? ronda;
        document.getElementById('ronda-titulo').textContent = `Ronda: ${ronda}`;
    }
    renderPersonajes();
    renderPersonajeSelects();
    renderEnfermedadesSelect();
}

function renderPersonajes() {
    const cont = document.getElementById('personajes-control');
    cont.innerHTML = '';
    const fila = document.createElement('div');
    fila.className = 'personajes';

    personajes.forEach((p, i) => {
        const barraAncho = (p.vida_max > 0) ? (p.vida_actual / p.vida_max) * 100 : 0;
        const div = document.createElement('div');
        div.className = 'personaje';
        div.innerHTML = `
            <strong>${p.nombre}</strong> ${p.turno ? "<span style='color:yellow'>(Turno)</span>" : ""}<br>
            <div class="barra">
                <div class="barra-vida" style="width:${barraAncho}%;background-color:${colorBarra(p.vida_actual,p.vida_max)}"></div>
            </div>
            <span id="vida-label-${i}" class="stat-label">${p.vida_actual}/${p.vida_max}</span><br>

            <button class="button button-red" onclick="modificar(${i}, 'vida', 1)">+Vida</button>
            <button class="button button-blue" onclick="modificar(${i}, 'vida', -1)">-Vida</button><br>

            <label class="label">Daño/Cura:</label>
            <input type="number" id="vida-${i}" value="0" class="input">
            <button class="button" onclick="modificar(${i}, 'vida', parseInt(document.getElementById('vida-${i}').value) || 0)">Aplicar</button><br>

            <label class="label">V.Max:</label>
            <input type="number" id="vidaMax-${i}" value="${p.vida_max}" class="input">
            <button class="button" onclick="aplicarVidaMax(${i})">Aplicar</button><br>

            <label class="label">Heridas:</label>
            <span id="heridas-${i}" class="stat-label">${p.heridas}</span>
            <button class="button button-red" onclick="modificar(${i}, 'heridas', 1)">+</button>
            <button class="button button-blue" onclick="modificar(${i}, 'heridas', -1)">-</button><br>

            <label class="label">Shock:</label>
            <span id="shock-${i}" class="stat-label">${p.shock}</span>
            <button class="button button-red" onclick="modificar(${i}, 'shock', 1)">+</button>
            <button class="button button-blue" onclick="modificar(${i}, 'shock', -1)">-</button><br>

            <label class="label">Inic.:</label>
            <input type="number" id="inic-${i}" value="${p.iniciativa || 0}" class="input">
            <button class="button" onclick="aplicarIniciativa(${i})">Aplicar</button><br>

            <label class="label">Estados:</label>
            <span id="estados-${i}" class="stat-label">${(p.estados || []).join(', ')}</span>
        `;
        fila.appendChild(div);
    });

    cont.appendChild(fila);
}

async function modificar(i, tipo, cantidad = 0) {
    const p = personajes[i];
    let vida = p.vida_actual || 0;
    let heridas = p.heridas || 0;
    let shock = p.shock || 0;

    if (tipo === 'vida') {
        const delta = Number(cantidad) || 0;
        vida = Math.max(0, Math.min(p.vida_max || Infinity, (p.vida_actual || 0) + delta));
    }
    if (tipo === 'heridas') {
        const heridas_antes = p.heridas || 0;
        heridas = Math.max(0, heridas_antes + Number(cantidad || 0));
        if (Number(cantidad) > 0 && heridas > 3) {
            const nuevas_heridas = Math.max(0, heridas - Math.max(3, heridas_antes));
            if (nuevas_heridas > 0) shock = Math.min(3, shock + nuevas_heridas);
        }
        if (heridas < 4) shock = 0;
    }
    if (tipo === 'shock') {
        shock = Math.max(0, Math.min(3, (p.shock || 0) + Number(cantidad || 0)));
    }

    await fetch('/actualizar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre: p.nombre, vida_actual: vida, heridas: heridas, shock: shock })
    });
    await fetchData();
}

async function aplicarVidaMax(i) {
    const p = personajes[i];
    let nuevoMax = parseInt(document.getElementById(`vidaMax-${i}`).value);
    if (isNaN(nuevoMax) || nuevoMax < 1) return;
    let nuevaVida = Math.min(p.vida_actual || 0, nuevoMax);

    await fetch('/actualizar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre: p.nombre, vida_actual: nuevaVida, vida_max: nuevoMax })
    });
    await fetchData();
}

async function aplicarIniciativa(i) {
    const p = personajes[i];
    let nuevoValor = parseInt(document.getElementById(`inic-${i}`).value);
    if (isNaN(nuevoValor)) return;

    await fetch('/actualizar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre: p.nombre, iniciativa: nuevoValor })
    });
    p.iniciativa = nuevoValor;
    renderPersonajes();
}

async function agregarPersonaje() {
    const nombre = document.getElementById("nombrePersonaje").value;

    await fetch("/actualizar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, personaje_accion: "agregar", })
    });
    await fetchData();

}

async function eliminarPersonaje() {
    const nombre = document.getElementById("nombrePersonaje").value;

    await fetch("/actualizar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, personaje_accion: "eliminar", })
    });
    await fetchData();

}

function siguienteNivel(nombreEnf, nivelActual) {
    const niveles = enfermedadProgresion[nombreEnf];
    const idx = niveles.indexOf(nivelActual);
    if (idx === -1 || idx === niveles.length - 1) return niveles[0];
    return niveles[idx + 1];
}

function renderPersonajeSelects() {
    const selEstado = document.getElementById("personaje-estado");
    const selEnf = document.getElementById("personaje-enfermedad");

    // Guardar selección actual
    const selEstadoValor = selEstado.value;
    const selEnfValor = selEnf.value;

    selEstado.innerHTML = personajes.map(p => `<option>${p.nombre}</option>`).join('');
    selEnf.innerHTML = personajes.map(p => `<option>${p.nombre}</option>`).join('');

    // Restaurar selección si existe
    if (personajes.some(p => p.nombre === selEstadoValor)) selEstado.value = selEstadoValor;
    if (personajes.some(p => p.nombre === selEnfValor)) selEnf.value = selEnfValor;
}

function renderEnfermedadesSelect() {
    const sel = document.getElementById("enfermedad-seleccionada");

    // Guardar selección actual
    const selValor = sel.value;
    sel.innerHTML = "";

    const nombrePersonaje = document.getElementById("personaje-enfermedad").value;
    const p = personajes.find(p => p.nombre === nombrePersonaje);

    for (const nombreEnf in enfermedadProgresion) {
        // Solo mostramos el nombre base en el desplegable
        sel.innerHTML += `<option value="${nombreEnf}">${nombreEnf}</option>`;
    }

    // Restaurar selección si existe
    if ([...sel.options].some(o => o.value === selValor)) sel.value = selValor;
}

async function agregarEstadoNormal() {
    const nombre = document.getElementById("personaje-estado").value;
    const estado = document.getElementById("estado-seleccionado").value;
    if (!nombre || !estado) return;

    await fetch("/actualizar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, estado_accion: "agregar", estado })
    });

    await fetchData();
}

async function quitarEstadoNormal() {
    const nombre = document.getElementById("personaje-estado").value;
    const estado = document.getElementById("estado-seleccionado").value;
    if (!nombre || !estado) return;

    await fetch("/actualizar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, estado_accion: "quitar", estado })
    });

    await fetchData();
}

async function agregarEnfermedad() {
    const nombre = document.getElementById("personaje-enfermedad").value;
    const enfNombre = document.getElementById("enfermedad-seleccionada").value;
    if (!nombre || !enfNombre) return;

    const p = personajes.find(p => p.nombre === nombre);
    if (!p.estados) p.estados = [];

    // Buscar si ya tiene esta enfermedad
    let idx = p.estados.findIndex(e => e.startsWith(enfNombre));
    let estadoActual = idx !== -1 ? p.estados[idx] : null;
    let nivelActual = estadoActual ? estadoActual.match(/\((.+)\)/)[1] : null;
    let nivelSiguiente = nivelActual ? siguienteNivel(enfNombre, nivelActual) : enfermedadProgresion[enfNombre][0];
    const estadoFinal = `${enfNombre} (${nivelSiguiente})`;

    if (idx !== -1) {
        // Reemplazar el nivel existente
        p.estados[idx] = estadoFinal;
    } else {
        // Agregar nuevo estado
        p.estados.push(estadoFinal);
    }

    await fetch("/actualizar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, estado_accion: "agregar", estado: estadoFinal })
    });

    await fetchData();
    renderEnfermedadesSelect();
}

async function quitarEnfermedad() {
    const nombre = document.getElementById("personaje-enfermedad").value;
    const enfNombre = document.getElementById("enfermedad-seleccionada").value;
    if (!nombre || !enfNombre) return;

    const p = personajes.find(p => p.nombre === nombre);
    let estadoActual = p.estados?.find(e => e.startsWith(enfNombre));
    if (!estadoActual) return;

    await fetch("/actualizar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, estado_accion: "quitar", estado: estadoActual })
    });

    await fetchData();
    renderEnfermedadesSelect();
}


// Turnos
async function pasarTurno() {
    if (personajes.length === 0) return;
    const turnoIndices = personajes.map((_, i) => i)
        .sort((a, b) => (personajes[b].iniciativa || 0) - (personajes[a].iniciativa || 0));
    personajes.forEach(p => p.turno = false);
    const idx = turnoIndices[turnoActual];
    personajes[idx].turno = true;
    const turnoNombre = personajes[idx].nombre;

    if (turnoActual === 0) {
        ronda = (ronda === 0) ? 1 : (ronda + 1);
    }

    await fetch('/actualizar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ turno: turnoNombre, ronda })
    });

    turnoActual = (turnoActual + 1) % turnoIndices.length;
    renderPersonajes();
    document.getElementById('ronda-titulo').textContent = `Ronda: ${ronda}`;
}

document.getElementById("personaje-enfermedad").addEventListener("change", renderEnfermedadesSelect);

fetchData();
</script>

</body>
</html>
