// Calcula color de la barra de vida
function colorBarra(vida_actual, vida_max) {
    const porcentaje = Math.max(0, Math.min(1, vida_actual / vida_max));
    const r = Math.round(255 * (1 - porcentaje));
    const g = Math.round(255 * porcentaje);
    return `rgb(${r},${g},0)`;  
}

// Estado previo de personajes para actualizar incrementalmente
const personajesPrev = {};

function crearPersonajeHTML(p){
    const ancho = (p.vida_actual / p.vida_max) * 100;
    const claseShock = p.shock == 1 ? "shock" : p.shock == 2 ? "shock-critico" : p.shock == 3 ? "shock-muerte" : "";
    const clases = [claseShock];
    if(p.turno) clases.push("turno");

    // Generar HTML de estados con colores
    const estadosHTML = p.estados && p.estados.length
        ? p.estados.map(e => {
            // Detectar nivel de enfermedad y asignar clase CSS
            const match = e.match(/\((Leve|Moderada|Grave|Crítica)\)$/);
            const claseNivel = match ? match[1] : e; // si no hay nivel, usa el nombre completo
            return `<span class="estado ${claseNivel}">${e}<span class="tooltip">${descripcionesEstados[e] || "Sin descripción"}</span></span>`;
        }).join(' ')
        : `<span class="estado">Ninguno</span>`;
   
   const heridasShockHTML = p.tipo === "character" 
        ? `
            <p>Heridas: <span class="heridas">${p.heridas}</span></p>
            <p>Shock: <span class="shock">${p.shock}</span></p>
          `
        : "";

    return `
    <div class="personaje ${clases.join(" ")}" id="personaje-${p.nombre}">
        <div class="cabecera">
            <div class="iniciativa">${p.iniciativa ?? '-'}</div>
            <h2>${p.nombre}</h2>
        </div>
        <img src="/static/images/${p.imagen}" alt="${p.nombre}" width="100">
        <div class="vida"><div class="barra" style="width:${ancho}%; background-color:${colorBarra(p.vida_actual,p.vida_max)};"></div></div>
        ${heridasShockHTML}
        <div class="estados">${estadosHTML}</div>
    </div>`;
}


// Función de actualización incremental
async function actualizarDashboard(){
    const res = await fetch('/dashboard-data');
    const data = await res.json();

    document.getElementById('ronda-titulo').textContent = `Ronda: ${data.ronda}`;

    data.personajes.forEach(p => {
        let div = document.getElementById(`personaje-${p.nombre}`);

        if(!div){
            // Crear personaje nuevo
            document.getElementById('personajes-dashboard').insertAdjacentHTML('beforeend', crearPersonajeHTML(p));
            personajesPrev[p.nombre] = {...p};
            return;
        }

        const prev = personajesPrev[p.nombre] || {};

        // Actualizar vida
        if(prev.vida_actual !== p.vida_actual || prev.vida_max !== p.vida_max){
            const barra = div.querySelector('.barra');
            barra.style.width = `${(p.vida_actual/p.vida_max)*100}%`;
            barra.style.backgroundColor = colorBarra(p.vida_actual,p.vida_max);
        }

        // Actualizar shock y turno
        if(prev.shock !== p.shock || prev.turno !== p.turno){
            div.classList.remove('shock','shock-critico','shock-muerte','turno');
            if(p.shock == 1) div.classList.add('shock');
            else if(p.shock == 2) div.classList.add('shock-critico');
            else if(p.shock == 3) div.classList.add('shock-muerte');
            if(p.turno) div.classList.add('turno');
        }
        // Actualizar iniciativa
        if (prev.iniciativa !== p.iniciativa) {
            div.querySelector('.iniciativa').textContent = p.iniciativa ?? '-';
        }

        // Heridas y shock numérico
        if(prev.heridas !== p.heridas){
            div.querySelector('.heridas').textContent = p.heridas;
        }
        if(prev.shock !== p.shock){
            div.querySelector('.shock').textContent = p.shock;
        }

        // Estados: actualizar solo si cambian
        const estadosDiv = div.querySelector('.estados');
        const prevEstados = prev.estados || [];
        const estadosIguales = JSON.stringify(prevEstados) === JSON.stringify(p.estados);
        if(!estadosIguales){
            estadosDiv.innerHTML = p.estados && p.estados.length
                ? p.estados.map(e => {
                    const match = e.match(/\((Leve|Moderada|Grave|Crítica)\)$/);
                    const claseNivel = match ? match[1] : e;
                    return `<span class="estado ${claseNivel}">${e}<span class="tooltip">${descripcionesEstados[e] || "Sin descripción"}</span></span>`;
                }).join(' ')
                : `<span class="estado">Ninguno</span>`;
        }

        // Guardar estado actualizado
        personajesPrev[p.nombre] = {...p};

        // Eliminar Auto
        Object.keys(personajesPrev).forEach(nombre => {
            if(!data.personajes.some(p => p.nombre === nombre)){
                const div = document.getElementById(`personaje-${nombre}`);
                if(div) div.remove();
                delete personajesPrev[nombre];
            }
        });

        const contenedor = document.getElementById('personajes-dashboard');
        [...contenedor.children].sort((a, b) => {
            const pa = data.personajes.find(p => `personaje-${p.nombre}` === a.id);
            const pb = data.personajes.find(p => `personaje-${p.nombre}` === b.id);
            return (pb?.iniciativa ?? 0) - (pa?.iniciativa ?? 0); // mayor iniciativa primero
        });
        
        let hayCambio = false;
        for (let i = 0; i < sorted.length; i++) {
            if (sorted[i] !== contenedor.children[i]) {
                hayCambio = true;
                break;
            }
        }

        // Solo reanexar si hay cambio
        if (hayCambio) {
            sorted.forEach(el => contenedor.appendChild(el));
        }
    });
}

// Llamada inicial
actualizarDashboard();

// Actualizar cada 2 segundos sin destruir tooltips
setInterval(actualizarDashboard, 2000);
</script>
