<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard DnD</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #1e1e1e;
    color: white;
    text-align: center;
}

.personajes {
    display: flex;
    flex-wrap: nowrap;
    gap: 20px;
    justify-content: center;
}

.personaje {
    border: 1px solid #ccc;
    padding: 10px;
    width: 200px;
    text-align: center;
    background-color: #2e2e2e;
    border-radius: 8px;
    color: white;
    transition: transform 0.3s, box-shadow 0.3s;

}

.personaje img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
}

.personaje.turno {
    border: 2px solid yellow;
    box-shadow: 0 0 15px yellow;
    transform: scale(1.05);
}

.cabecera {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 5px;
}

.iniciativa {
    font-size: 1.2em;
    font-weight: bold;
    color: white;
    text-shadow: 
        -1px -1px 0 #000,  
        1px -1px 0 #000,
        -1px  1px 0 #000,
        1px  1px 0 #000; 
}

.vida {
    background: #555;
    height: 20px;
    width: 100%;
    margin: 5px 0;
    border-radius: 5px;
    overflow: hidden;
}

.barra {
    height: 100%;
    width: 0%;
    border-radius: 5px;
    transition: width 0.5s, background-color 0.5s;
}

.estados {
    margin-top: 5px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
}

.estado {
    position: relative;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.8em;
    font-weight: bold;
    color: white;
    cursor: pointer;
    transition: transform 0.2s;
}

/* Hover: agrandar estado */
.estado:hover {
    transform: scale(1.2);
    z-index: 10;
}

/* Tooltip flotante */
.estado .tooltip {
    visibility: hidden;
    opacity: 0;
    width: 160px;
    background-color: #333;
    color: #fff;
    text-align: left;
    border-radius: 6px;
    padding: 6px;
    position: absolute;
    bottom: 125%; /* sobre el estado */
    left: 50%;
    transform: translateX(-50%);
    transition: opacity 0.3s;
    font-size: 0.75em;
    pointer-events: none;
    box-shadow: 0 0 8px rgba(0,0,0,0.5);
}

/* Flecha del tooltip */
.estado .tooltip::after {
    content: '';
    position: absolute;
    top: 100%; 
    left: 50%;
    margin-left: -5px;
    border-width: 5px;
    border-style: solid;
    border-color: #333 transparent transparent transparent;
}

/* Mostrar tooltip al hover */
.estado:hover .tooltip {
    visibility: visible;
    opacity: 1;
}

.estado.Agarrado { background-color: #423404; }
.estado.Apresado { background-color: #b6e702; }
.estado.Asustado { background-color: #000275; }
.estado.Aturdido { background-color: #b10ff1; }
.estado.Cansancio { background-color: #90b2b5; }
.estado.Cegado { background-color: #7c7c7c; }
.estado.Derribado { background-color: #d35400; }
.estado.Ensordecido { background-color: #16a085; }
.estado.Envenenado { background-color: #00f314; }
.estado.Hechizado { background-color: #e092ff; }
.estado.Incapacitado { background-color: #e74c3c; }
.estado.Inconsciente { background-color: #2c3e50; }
.estado.Invisible { background-color: #7f8c8d; }
.estado.Paralizado { background-color: #53ebac; }
.estado.Petrificado { background-color: #5e2500; }

.estado.Leve { background-color: #093b09; }     
.estado.Moderada { background-color: #53490d; }   
.estado.Grave { background-color: #5a3910; }     
.estado.Crítica { background-color: #632711; }

/* Animación de parpadeo rojo */
@keyframes parpadeo-rojo {
0% { background-color: #2e2e2e; }
50% { background-color: #ff0000ab; }
100% { background-color: #2e2e2e; }
}
/* Animación de parpadeo naranja */
@keyframes parpadeo-naranja {
    0% { background-color: #2e2e2e; }
    50% { background-color: #ff8000ab; }
    100% { background-color: #2e2e2e; }
}

.personaje.shock-critico {
    animation: parpadeo-rojo 2s infinite;
}
.personaje.shock {
    animation: parpadeo-naranja 2s infinite;
}
.personaje.shock-muerte {
    background-color: #000000;
    animation: none;        
}

</style>
</head>
<body>

<div class="personajes" id="personajes-dashboard"></div>

// Calcula color de la barra de vida
function colorBarra(vida_actual, vida_max) {
    const porcentaje = Math.max(0, Math.min(1, vida_actual / vida_max));
    const r = Math.round(255 * (1 - porcentaje));
    const g = Math.round(255 * porcentaje);
    return `rgb(${r},${g},0)`;  
}

// Estado previo de personajes para actualizar incrementalmente
const personajesPrev = {};

function crearPersonajeHTML(p){
    const ancho = (p.vida_actual / p.vida_max) * 100;
    const claseShock = p.shock == 1 ? "shock" : p.shock == 2 ? "shock-critico" : p.shock == 3 ? "shock-muerte" : "";
    const clases = [claseShock];
    if(p.turno) clases.push("turno");

    // Generar HTML de estados con colores
    const estadosHTML = p.estados && p.estados.length
        ? p.estados.map(e => {
            // Detectar nivel de enfermedad y asignar clase CSS
            const match = e.match(/\((Leve|Moderada|Grave|Crítica)\)$/);
            const claseNivel = match ? match[1] : e; // si no hay nivel, usa el nombre completo
            return `<span class="estado ${claseNivel}">${e}<span class="tooltip">${descripcionesEstados[e] || "Sin descripción"}</span></span>`;
        }).join(' ')
        : `<span class="estado">Ninguno</span>`;

    return `
    <div class="personaje ${clases.join(" ")}" id="personaje-${p.nombre}">
        <div class="cabecera">
            <div class="iniciativa">${p.iniciativa ?? '-'}</div>
            <h2>${p.nombre}</h2>
        </div>
        <img src="/static/images/${p.imagen}" alt="${p.nombre}" width="100">
        <div class="vida"><div class="barra" style="width:${ancho}%; background-color:${colorBarra(p.vida_actual,p.vida_max)};"></div></div>
        <p>Heridas: <span class="heridas">${p.heridas}</span></p>
        <p>Shock: <span class="shock">${p.shock}</span></p>
        <div class="estados">${estadosHTML}</div>
    </div>`;
}


// Función de actualización incremental
async function actualizarDashboard(){
    const res = await fetch('/dashboard-data');
    const data = await res.json();

    document.getElementById('ronda-titulo').textContent = `Ronda: ${data.ronda}`;

    data.personajes.forEach(p => {
        let div = document.getElementById(`personaje-${p.nombre}`);

        if(!div){
            // Crear personaje nuevo
            document.getElementById('personajes-dashboard').insertAdjacentHTML('beforeend', crearPersonajeHTML(p));
            personajesPrev[p.nombre] = {...p};
            return;
        }

        const prev = personajesPrev[p.nombre] || {};

        // Actualizar vida
        if(prev.vida_actual !== p.vida_actual || prev.vida_max !== p.vida_max){
            const barra = div.querySelector('.barra');
            barra.style.width = `${(p.vida_actual/p.vida_max)*100}%`;
            barra.style.backgroundColor = colorBarra(p.vida_actual,p.vida_max);
        }

        // Actualizar shock y turno
        if(prev.shock !== p.shock || prev.turno !== p.turno){
            div.classList.remove('shock','shock-critico','shock-muerte','turno');
            if(p.shock == 1) div.classList.add('shock');
            else if(p.shock == 2) div.classList.add('shock-critico');
            else if(p.shock == 3) div.classList.add('shock-muerte');
            if(p.turno) div.classList.add('turno');
        }

        // Heridas y shock numérico
        if(prev.heridas !== p.heridas){
            div.querySelector('.heridas').textContent = p.heridas;
        }
        if(prev.shock !== p.shock){
            div.querySelector('.shock').textContent = p.shock;
        }

        // Estados: actualizar solo si cambian
        const estadosDiv = div.querySelector('.estados');
        const prevEstados = prev.estados || [];
        const estadosIguales = JSON.stringify(prevEstados) === JSON.stringify(p.estados);
        if(!estadosIguales){
            estadosDiv.innerHTML = p.estados && p.estados.length
                ? p.estados.map(e => `<span class="estado ${e}">${e}<span class="tooltip">${descripcionesEstados[e] || "Sin descripción"}</span></span>`).join(' ')
                : `<span class="estado">Ninguno</span>`;
        }

        // Guardar estado actualizado
        personajesPrev[p.nombre] = {...p};
    });
}

// Llamada inicial
actualizarDashboard();

// Actualizar cada 2 segundos sin destruir tooltips
setInterval(actualizarDashboard, 2000);
</script>
</body>
</html>
