<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard DnD</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
.personajes {
    display: flex;
    flex-wrap: nowrap;
    gap: 20px;
    justify-content: center;
}

.personaje {
    border: 1px solid #ccc;
    padding: 10px;
    width: 200px;
    text-align: center;
    background-color: #2e2e2e;
    border-radius: 8px;
    color: white;
}

/* Cabecera con iniciativa + nombre */
.cabecera {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 5px;
}

.iniciativa {
    font-size: 1.2em;
    font-weight: bold;
    color: white;
    text-shadow: 
        -1px -1px 0 #000,  
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000; /* contorno negro */
}

.vida {
    background: #555;
    height: 20px;
    width: 100%;
    margin: 5px 0;
    border-radius: 5px;
    overflow: hidden;
}

.barra {
    height: 100%;
    width: 0%;
    border-radius: 5px;
    transition: width 0.5s, background-color 0.5s;
}

.estados {
    margin-top: 5px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
}

/* Badges de estados */
.estado {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.8em;
    font-weight: bold;
    color: white;
}

.estado.Agarrado { background-color: #423404; }
.estado.Apresado { background-color: #b6e702; }
.estado.Asustado { background-color: #000275; }
.estado.Aturdido { background-color: #b10ff1; }
.estado.Cansancio { background-color: #95a5a6; }
.estado.Cegado { background-color: #7c7c7c; }
.estado.Derribado { background-color: #d35400; }
.estado.Ensordecido { background-color: #16a085; }
.estado.Envenenado { background-color: #00f314; }
.estado.Hechizado { background-color: #e092ff; }
.estado.Incapacitado { background-color: #e74c3c; }
.estado.Inconsciente { background-color: #2c3e50; }
.estado.Invisible { background-color: #7f8c8d; }
.estado.Paralizado { background-color: #53ebac; }
.estado.Petrificado { background-color: #5e2500; }
</style>
</head>
<body>
<h1>Personajes</h1>
<div class="personajes" id="personajes-dashboard">
    {% for p in personajes %}
    <div class="personaje">
        <div class="cabecera">
            <div class="iniciativa">{{ p.iniciativa }}</div>
            <h2>{{ p.nombre }}</h2>
        </div>
        <img src="{{ url_for('static', filename='images/' + p.imagen) }}" alt="{{ p.nombre }}" width="100">
        <div class="vida">
            <div class="barra" style="width: {{ (p.vida_actual / p.vida_max) * 100 }}%; background-color: {% if (p.vida_actual / p.vida_max) > 0.6 %}#0f0{% elif (p.vida_actual / p.vida_max) > 0.3 %}#f1c40f{% else %}#e74c3c{% endif %};"></div>
        </div>
        <p>Heridas: {{ p.heridas }}</p>
        <p>Shock: {{ p.shock }}</p>
        <div class="estados">
            {% if p.estados %}
                {% for est in p.estados %}
                    <span class="estado {{ est }}">{{ est }}</span>
                {% endfor %}
            {% else %}
                <span class="estado">Ninguno</span>
            {% endif %}
        </div>
    </div>
    {% endfor %}
</div>

<script>
function colorBarra(vida_actual, vida_max) {
    const porcentaje = Math.max(0, Math.min(1, vida_actual / vida_max));
    const r = Math.round(231 + (15 - 231) * porcentaje);  
    const g = Math.round(76 + (255 - 76) * porcentaje);   
    const b = Math.round(60 + (0 - 60) * porcentaje);     
    return `rgb(${r},${g},${b})`;
}

async function actualizarDashboard(){
    const res = await fetch('/dashboard-data');
    const data = await res.json();
    const cont = document.getElementById('personajes-dashboard');
    cont.innerHTML = '';
    data.personajes.forEach(p => {
        const estadosHTML = p.estados && p.estados.length
            ? p.estados.map(e => `<span class="estado ${e}">${e}</span>`).join(' ')
            : `<span class="estado">Ninguno</span>`;
        const ancho = (p.vida_actual / p.vida_max) * 100;
        const color = colorBarra(p.vida_actual, p.vida_max);
        cont.innerHTML += `
        <div class="personaje">
            <div class="cabecera">
                <div class="iniciativa">${p.iniciativa ?? '-'}</div>
                <h2>${p.nombre}</h2>
            </div>
            <img src="/static/images/${p.imagen}" alt="${p.nombre}" width="100">
            <div class="vida"><div class="barra" style="width:${ancho}%; background-color:${color};"></div></div>
            <p>Heridas: ${p.heridas}</p>
            <p>Shock: ${p.shock}</p>
            <div class="estados">${estadosHTML}</div>
        </div>`;
    });
}

setInterval(actualizarDashboard, 2000);
</script>
</body>
</html>
